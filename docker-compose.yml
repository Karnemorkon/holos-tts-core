# holos-tts-core: C++ native TTS server (:8004), API-parity with HolosTTS-hybrid.
#
# Models: auto-downloaded on first `docker compose up -d` (HF, ~0.6 GB, public
# repo, no token) into the holos_core_models volume; subsequent starts are
# instant (downloader fetches only missing files).
#   force re-download: docker compose run --rm downloader python3 scripts/download_models.py --out models --force
#   legacy M2M100 verbalizer: add --with-m2m100
#
# Cloned voices (UI): persisted in the holos_core_speakers volume (speakers/*.npy,
# numpy-compatible with HolosTTS-hybrid); models volume stays read-only.
#
# Rule-only (no neural verbalizer, ~468 MB RSS instead of ~1.1 GB):
#   set HOLOS_VERBALIZER_DIR="" (empty) in environment.

services:
  holos-core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: holos-tts-core:latest
    container_name: holos-core
    ports:
      - "8004:8004"
    environment:
      - HOLOS_MODELS_DIR=/app/models
      # neural (default) | rule | off — також перемикається per-request через UI/API
      - HOLOS_VERBALIZER_DIR=/app/models/verbalizer/gemma-int8
      - HOLOS_PORT=8004
      # клоновані голоси (speakers/*.npy), writable volume
      - HOLOS_SPEAKERS_DIR=/app/speakers
    volumes:
      - holos_core_models:/app/models:ro
      - holos_core_speakers:/app/speakers
    depends_on:
      downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 3g
    memswap_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8004/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Auto-init: populate holos_core_models volume from HF before holos-core starts.
  # Idempotent — skips download when models are already present.
  downloader:
    image: python:3.11-slim
    working_dir: /work
    environment:
      - HF_HOME=/work/.hf_cache
    volumes:
      - .:/work
      - holos_core_models:/work/models
    command: >
      sh -c "pip install -q huggingface_hub &&
             python3 scripts/download_models.py --out models"

volumes:
  holos_core_models:
    name: holos_core_models
  holos_core_speakers:
    name: holos_core_speakers
