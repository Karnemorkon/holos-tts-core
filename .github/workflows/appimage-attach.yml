name: Attach desktop AppImage to release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.7.0

permissions:
  contents: write

concurrency:
  group: appimage-attach-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.31.0"
  TAG: ${{ github.event.inputs.tag || 'v0.7.0' }}

jobs:
  build:
    name: Build desktop AppImage (Tauri)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          path: src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config zlib1g-dev libssl-dev uuid-dev \
            libc-ares-dev libjsoncpp-dev libsentencepiece-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            xvfb desktop-file-utils

      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ~/ort
          key: ort-${{ env.ORT_VERSION }}-linux-x64

      - name: Install ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          mkdir -p "$HOME/ort"
          tar -xzf /tmp/ort.tgz -C "$HOME/ort" --strip-components=1
          rm -f /tmp/ort.tgz

      - name: Configure and build server
        working-directory: src
        run: |
          # shellcheck disable=SC2016  # $ORIGIN must stay literal for the linker
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/holos-tts-core" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DHOLOS_WITH_ORT=ON \
            -DHOLOS_ORT_ROOT="$HOME/ort" \
            -DHOLOS_WITH_CT2=OFF \
            -DHOLOS_WITH_VERBALIZER=ON \
            -DHOLOS_WITH_SERVER=ON \
            -DHOLOS_BUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --install build
          LD_LIBRARY_PATH="$HOME/ort/lib" \
            packaging/linux/make-bundle.sh "$PWD/dist/holos-tts-core"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: src/.model-cache
          key: holos-models-v1-${{ runner.os }}

      - name: Download models
        working-directory: src
        run: |
          HOLOS_MODELS_DIR="$PWD/.model-cache" \
            dist/holos-tts-core/download-models.sh

      - name: Stage Tauri sidecar and libs
        run: |
          set -euo pipefail
          mkdir -p src/desktop/tauri/src-tauri/binaries src/desktop/tauri/src-tauri/resources/lib
          cp src/dist/holos-tts-core/bin/holos-server \
            src/desktop/tauri/src-tauri/binaries/holos-server-x86_64-unknown-linux-gnu
          cp -a src/dist/holos-tts-core/lib/. src/desktop/tauri/src-tauri/resources/lib/

      - name: Install Tauri CLI
        working-directory: src/desktop/tauri
        run: npm install

      - name: Build AppImage
        working-directory: src/desktop/tauri
        run: npx tauri build

      - name: Smoke test AppImage
        run: |
          set -euo pipefail
          VERSION="$(src/dist/holos-tts-core/bin/holos-cli version)"
          APP="$(find src/desktop/tauri/src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -print -quit)"
          test -n "$APP"
          DEST="src/holos-tts-core-${VERSION}-x86_64.AppImage"
          mv "$APP" "$DEST"
          export XDG_DATA_HOME="$RUNNER_TEMP/holos-tauri-data"
          mkdir -p "$XDG_DATA_HOME/holos-tts-core/models"
          cp -a src/.model-cache/. "$XDG_DATA_HOME/holos-tts-core/models/"
          export HOLOS_PORT=8004
          xvfb-run -a env \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            HOLOS_PORT="$HOLOS_PORT" \
            XDG_DATA_HOME="$XDG_DATA_HOME" \
            "./$DEST" > /tmp/tauri-appimage.log 2>&1 &
          echo $! > /tmp/tauri-appimage.pid
          trap 'kill "$(cat /tmp/tauri-appimage.pid)" 2>/dev/null || true; pkill -f holos-server 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -sf --max-time 2 http://127.0.0.1:$HOLOS_PORT/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          python3 src/scripts/smoke_api.py http://127.0.0.1:$HOLOS_PORT "$VERSION"
          kill "$(cat /tmp/tauri-appimage.pid)" 2>/dev/null || true
          pkill -f holos-server 2>/dev/null || true
          trap - EXIT

      - name: Dump logs on failure
        if: failure()
        run: tail -100 /tmp/tauri-appimage.log 2>/dev/null || true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: holos-desktop-appimage
          path: src/holos-tts-core-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach to release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: holos-desktop-appimage
          path: dist

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 1 -name 'holos-tts-core-*-x86_64.AppImage' -print -quit)"
          gh release upload "$TAG" "$APP" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Rebuild SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'holos-tts-core-*-linux-x64.tar.gz' --dir release-assets --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'holos-tts-core-*-windows-x64.zip' --dir release-assets --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'holos-tts-core-*-windows-x64-setup.exe' --dir release-assets --clobber || true
          find dist -name 'holos-tts-core-*-x86_64.AppImage' \
            -exec cp {} release-assets/ \;
          (
            cd release-assets
            sha256sum holos-tts-core-* > SHA256SUMS
            sha256sum -c SHA256SUMS
            cat SHA256SUMS
          )
          gh release upload "$TAG" release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/notes.md
          if grep -q 'desktop AppImage' /tmp/notes.md; then
            echo 'release notes already mention desktop AppImage'
            exit 0
          fi
          {
            cat /tmp/notes.md
            printf '\n\n### Desktop AppImage (x86_64, GUI)\n\n'
            printf -- '- **holos-tts-core-%s-x86_64.AppImage** — native window (Tauri); models download on first run (~0.6 ГБ).\n' "${TAG#v}"
            printf -- '- Requires Ubuntu 24.04+/Debian 13+ (glibc 2.39+); install webkit2gtk-4.1 or run with --appimage-extract-and-run.\n'
          } > /tmp/notes-appimage.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes-appimage.md
