name: Portable builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ORT_VERSION: "1.31.0"

jobs:
  linux:
    name: linux x64 bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config zlib1g-dev libssl-dev uuid-dev \
            libc-ares-dev libjsoncpp-dev libsentencepiece-dev \
            binutils file

      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ~/ort
          key: ort-${{ env.ORT_VERSION }}-linux-x64

      - name: Install ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          mkdir -p "$HOME/ort"
          tar -xzf /tmp/ort.tgz -C "$HOME/ort" --strip-components=1
          rm /tmp/ort.tgz

      - name: Configure
        run: |
          # shellcheck disable=SC2016  # $ORIGIN must stay literal for the linker
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/holos-tts-core" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DHOLOS_WITH_ORT=ON \
            -DHOLOS_ORT_ROOT="$HOME/ort" \
            -DHOLOS_WITH_CT2=OFF \
            -DHOLOS_WITH_VERBALIZER=ON \
            -DHOLOS_WITH_SERVER=ON \
            -DHOLOS_BUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF

      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Bundle runtime
        run: |
          LD_LIBRARY_PATH="$HOME/ort/lib" \
            packaging/linux/make-bundle.sh "$PWD/dist/holos-tts-core"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: holos-models-v1-${{ runner.os }}

      - name: Download models
        run: |
          HOLOS_MODELS_DIR="$PWD/.model-cache" \
            dist/holos-tts-core/download-models.sh

      - name: Smoke test bundle
        run: |
          set -euo pipefail
          cd dist/holos-tts-core
          VERSION="$(bin/holos-cli version)"
          HOLOS_OPEN_BROWSER=0 \
          HOLOS_MODELS_DIR="$GITHUB_WORKSPACE/.model-cache" \
          HOLOS_VERBALIZER_DIR="$GITHUB_WORKSPACE/.model-cache/verbalizer/gemma-int8" \
          HOLOS_VOICE_ENCODER="$GITHUB_WORKSPACE/.model-cache/voice_encoder.onnx" \
          HOLOS_SPEAKERS_DIR="$GITHUB_WORKSPACE/.speakers" \
            ./holos-tts.sh > /tmp/portable.log 2>&1 &
          echo $! > /tmp/portable.pid
          trap 'kill "$(cat /tmp/portable.pid)" 2>/dev/null || true' EXIT
          python3 "$GITHUB_WORKSPACE/scripts/smoke_api.py" http://127.0.0.1:8004 "$VERSION"
          kill "$(cat /tmp/portable.pid)" 2>/dev/null || true
          trap - EXIT
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Tar bundle
        run: |
          tar -C dist -czf "holos-tts-core-${version}-linux-x64.tar.gz" holos-tts-core
          ls -lh holos-tts-core-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: holos-tts-core-*-linux-x64.tar.gz

  tauri-linux:
    name: linux desktop AppImage (Tauri)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config zlib1g-dev libssl-dev uuid-dev \
            libc-ares-dev libjsoncpp-dev libsentencepiece-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            xvfb file desktop-file-utils

      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ~/ort
          key: ort-${{ env.ORT_VERSION }}-linux-x64

      - name: Install ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          mkdir -p "$HOME/ort"
          tar -xzf /tmp/ort.tgz -C "$HOME/ort" --strip-components=1
          rm /tmp/ort.tgz

      - name: Configure and build server
        run: |
          # shellcheck disable=SC2016  # $ORIGIN must stay literal for the linker
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/holos-tts-core" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DHOLOS_WITH_ORT=ON \
            -DHOLOS_ORT_ROOT="$HOME/ort" \
            -DHOLOS_WITH_CT2=OFF \
            -DHOLOS_WITH_VERBALIZER=ON \
            -DHOLOS_WITH_SERVER=ON \
            -DHOLOS_BUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --install build
          LD_LIBRARY_PATH="$HOME/ort/lib" \
            packaging/linux/make-bundle.sh "$PWD/dist/holos-tts-core"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: holos-models-v1-${{ runner.os }}

      - name: Download models
        run: |
          HOLOS_MODELS_DIR="$PWD/.model-cache" \
            dist/holos-tts-core/download-models.sh

      - name: Stage Tauri sidecar and libs
        run: |
          set -euo pipefail
          mkdir -p desktop/tauri/src-tauri/binaries desktop/tauri/src-tauri/resources/lib
          cp dist/holos-tts-core/bin/holos-server \
            desktop/tauri/src-tauri/binaries/holos-server-x86_64-unknown-linux-gnu
          cp -a dist/holos-tts-core/lib/. desktop/tauri/src-tauri/resources/lib/

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/tauri/src-tauri/target
          key: cargo-linux-${{ hashFiles('desktop/tauri/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm install

      - name: Build launcher binary
        working-directory: desktop/tauri
        run: npx tauri build --no-bundle

      # AppImage збираємо вручну: всередині лише наші файли, а WebKit/GTK/
      # GStreamer беруться з системи. Інакше linuxdeploy пакує стек Ubuntu
      # 24.04, який на Debian 13 валить WebKitWebProcess (білий екран).
      - name: Assemble AppImage
        run: |
          set -euo pipefail
          VERSION="$(dist/holos-tts-core/bin/holos-cli version)"
          DEST="holos-tts-core-${VERSION}-x86_64.AppImage"
          APPDIR="$PWD/build/appimage"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/lib/HolosTTS/lib" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp desktop/tauri/src-tauri/target/release/holos-tts "$APPDIR/usr/bin/holos-tts"
          cp dist/holos-tts-core/bin/holos-server "$APPDIR/usr/bin/holos-server"
          cp -a dist/holos-tts-core/lib/. "$APPDIR/usr/lib/HolosTTS/lib/"

          cat > "$APPDIR/HolosTTS.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HolosTTS
          Comment=Ukrainian text-to-speech
          Exec=holos-tts
          Icon=holos-tts
          Terminal=false
          Categories=AudioVideo;Audio;
          EOF
          cp "$APPDIR/HolosTTS.desktop" "$APPDIR/usr/share/applications/HolosTTS.desktop"

          cp desktop/tauri/src-tauri/icons/128x128@2x.png "$APPDIR/holos-tts.png"
          cp "$APPDIR/holos-tts.png" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/holos-tts.png"
          ln -sf holos-tts.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          # LD_LIBRARY_PATH навмисно не чіпаємо: лаунчер і WebKit мають бачити
          # системні бібліотеки. Наші ліби сайдкар отримує від лаунчера.
          LDCONFIG="$(command -v ldconfig || true)"
          if [ -n "$LDCONFIG" ] && ! "$LDCONFIG" -p 2>/dev/null | grep -q 'libwebkit2gtk-4.1.so.0'; then
            MSG="HolosTTS потребує WebKitGTK 4.1. Встановіть: sudo apt install libwebkit2gtk-4.1-0"
            if command -v zenity >/dev/null 2>&1; then zenity --error --text="$MSG"; fi
            echo "$MSG" >&2
            exit 1
          fi
          exec "$HERE/usr/bin/holos-tts" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/appimagetool "$APPDIR" "$DEST"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"

      - name: Verify AppImage has no bundled GUI stack
        run: |
          set -euo pipefail
          rm -rf /tmp/appdir-check && mkdir -p /tmp/appdir-check
          (cd /tmp/appdir-check && "$GITHUB_WORKSPACE/$DEST" --appimage-extract >/dev/null)
          test -x /tmp/appdir-check/squashfs-root/AppRun
          if find /tmp/appdir-check/squashfs-root \
              \( -name 'libwebkit2gtk*' -o -name 'libjavascriptcoregtk*' \
                 -o -name 'libgtk-3*' -o -name 'libgdk-3*' \
                 -o -name 'libglib-2.0*' -o -name 'libgio-2.0*' \
                 -o -name 'libgobject-2.0*' -o -name 'libgst*' \
                 -o -name 'WebKitWebProcess' -o -name 'WebKitNetworkProcess' \) \
              -print -quit | grep -q .; then
            echo "AppImage містить системні GUI-бібліотеки" >&2
            exit 1
          fi

      - name: Smoke test AppImage
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/holos-tauri-data"
          mkdir -p "$XDG_DATA_HOME/holos-tts-core/models"
          cp -a .model-cache/. "$XDG_DATA_HOME/holos-tts-core/models/"
          export HOLOS_PORT=8004
          export HOLOS_OPEN_BROWSER=0
          xvfb-run -a env \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            HOLOS_PORT="$HOLOS_PORT" \
            XDG_DATA_HOME="$XDG_DATA_HOME" \
            "./$DEST" > /tmp/tauri-appimage.log 2>&1 &
          echo $! > /tmp/tauri-appimage.pid
          trap 'kill "$(cat /tmp/tauri-appimage.pid)" 2>/dev/null || true; pkill -f holos-server 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -sf --max-time 2 http://127.0.0.1:$HOLOS_PORT/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          python3 scripts/smoke_api.py http://127.0.0.1:$HOLOS_PORT "$VERSION"
          kill "$(cat /tmp/tauri-appimage.pid)" 2>/dev/null || true
          pkill -f holos-server 2>/dev/null || true
          trap - EXIT

      - name: Dump logs on failure
        if: failure()
        run: |
          tail -100 /tmp/tauri-appimage.log 2>/dev/null || true
          tail -100 "$RUNNER_TEMP/holos-tauri-data/holos-tts-core/logs/sidecar.log" 2>/dev/null || true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-appimage
          path: holos-tts-core-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: windows x64 bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-md
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            drogon:x64-windows-static-md sentencepiece:x64-windows-static-md

      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: C:\ort
          key: ort-${{ env.ORT_VERSION }}-win-x64-flat

      - name: Install ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ort | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" `
            -OutFile "$env:RUNNER_TEMP\ort.zip"
          Expand-Archive "$env:RUNNER_TEMP\ort.zip" -DestinationPath "$env:RUNNER_TEMP\ort" -Force
          $inner = Get-ChildItem "$env:RUNNER_TEMP\ort" -Directory | Select-Object -First 1
          Copy-Item "$($inner.FullName)\*" C:\ort -Recurse -Force

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_INSTALL_PREFIX="$PWD\dist\holos-tts-core" `
            -DCMAKE_BUILD_TYPE=Release `
            -DHOLOS_WITH_ORT=ON `
            -DHOLOS_ORT_ROOT="C:\ort" `
            -DHOLOS_WITH_CT2=OFF `
            -DHOLOS_WITH_VERBALIZER=ON `
            -DHOLOS_WITH_SERVER=ON `
            -DHOLOS_BUILD_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DHOLOS_USE_SYSTEM_DROGON=ON `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle runtime
        shell: pwsh
        run: |
          packaging\windows\make-bundle.ps1 -Prefix "$PWD\dist\holos-tts-core" -OrtBin "C:\ort\lib"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: holos-models-v1-${{ runner.os }}

      - name: Download models
        shell: pwsh
        run: |
          $env:HOLOS_MODELS_DIR = "$env:GITHUB_WORKSPACE\.model-cache"
          packaging\windows\download-models.ps1

      - name: Smoke test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "$PWD\dist\holos-tts-core"
          $version = & "$bundle\bin\holos-cli.exe" version
          $env:PATH = "$bundle\bin;$env:PATH"
          $env:HOLOS_MODELS_DIR = "$env:GITHUB_WORKSPACE\.model-cache"
          $env:HOLOS_VERBALIZER_DIR = "$env:HOLOS_MODELS_DIR\verbalizer\gemma-int8"
          $env:HOLOS_SPEAKERS_DIR = "$env:GITHUB_WORKSPACE\.speakers"
          $env:HOLOS_HOST = "127.0.0.1"
          $env:HOLOS_PORT = "8004"
          $proc = Start-Process -FilePath "$bundle\bin\holos-server.exe" -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\holos.out" `
            -RedirectStandardError "$env:RUNNER_TEMP\holos.err"
          try {
            python scripts/smoke_api.py http://127.0.0.1:8004 $version
            if ($LASTEXITCODE -ne 0) { throw "smoke failed ($LASTEXITCODE)" }
          } catch {
            Get-Content "$env:RUNNER_TEMP\holos.out", "$env:RUNNER_TEMP\holos.err" -Tail 80
            throw
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Zip bundle
        shell: pwsh
        run: |
          $version = $env:version
          if (-not $version) { throw "version env missing" }
          Push-Location dist
          Compress-Archive -Path holos-tts-core -DestinationPath "..\holos-tts-core-$version-windows-x64.zip" -Force
          Pop-Location
          Get-Item holos-tts-core-*.zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: holos-tts-core-*-windows-x64.zip

      - name: Save vcpkg cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-md

  tauri-windows:
    name: windows desktop installer (Tauri NSIS)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-md
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            drogon:x64-windows-static-md sentencepiece:x64-windows-static-md

      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: C:\ort
          key: ort-${{ env.ORT_VERSION }}-win-x64-flat

      - name: Install ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ort | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" `
            -OutFile "$env:RUNNER_TEMP\ort.zip"
          Expand-Archive "$env:RUNNER_TEMP\ort.zip" -DestinationPath "$env:RUNNER_TEMP\ort" -Force
          $inner = Get-ChildItem "$env:RUNNER_TEMP\ort" -Directory | Select-Object -First 1
          Copy-Item "$($inner.FullName)\*" C:\ort -Recurse -Force

      - name: Build and bundle server
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_INSTALL_PREFIX="$PWD\dist\holos-tts-core" `
            -DCMAKE_BUILD_TYPE=Release `
            -DHOLOS_WITH_ORT=ON `
            -DHOLOS_ORT_ROOT="C:\ort" `
            -DHOLOS_WITH_CT2=OFF `
            -DHOLOS_WITH_VERBALIZER=ON `
            -DHOLOS_WITH_SERVER=ON `
            -DHOLOS_BUILD_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DHOLOS_USE_SYSTEM_DROGON=ON `
            -DBUILD_SHARED_LIBS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          packaging\windows\make-bundle.ps1 -Prefix "$PWD\dist\holos-tts-core" -OrtBin "C:\ort\lib"

      - name: Stage Tauri sidecar and DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force desktop\tauri\src-tauri\binaries | Out-Null
          New-Item -ItemType Directory -Force desktop\tauri\src-tauri\resources\lib | Out-Null
          Copy-Item dist\holos-tts-core\bin\holos-server.exe `
            desktop\tauri\src-tauri\binaries\holos-server-x86_64-pc-windows-msvc.exe
          Copy-Item dist\holos-tts-core\bin\*.dll desktop\tauri\src-tauri\resources\lib\

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/tauri/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/tauri/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        shell: pwsh
        run: npm install

      - name: Build NSIS installer
        working-directory: desktop/tauri
        shell: pwsh
        run: npx tauri build

      - name: Rename installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = & "dist\holos-tts-core\bin\holos-cli.exe" version
          if (-not $version) { throw "version missing" }
          $installer = Get-ChildItem desktop\tauri\src-tauri\target -Recurse -Filter '*-setup.exe' |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "holos-tts-core-$version-windows-x64-setup.exe"
          Get-Item "holos-tts-core-*-windows-x64-setup.exe" | Format-List Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: holos-tts-core-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, tauri-linux, windows, tauri-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # shellcheck disable=SC2035  # glob over release artifacts is intentional
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
